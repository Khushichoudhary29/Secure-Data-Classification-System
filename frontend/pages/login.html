<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Secure Data Classification</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <div class="container">
      <div style="flex: 1; display: flex; align-items: center; justify-content: center;">
        <div class="glass-card fade-in" style="width: 100%; max-width: 450px; margin: 0;">
            <h1><i class="fa-solid fa-shield-halved" style="color: #38bdf8; margin-right: 10px;"></i>Secure Login</h1>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username"><i class="fa-regular fa-envelope"></i> Username/Email</label>
                    <input type="text" id="username" name="username" placeholder="Enter username or email" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
            </form>
            
            <p style="text-align: center; margin-top: 1rem;">
                No account? <a href="register.html">Register</a>
            </p>
            
            <div id="message"></div>
        </div>
      </div>
    </div>
    
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/common.js"></script>
</body>
</html>
