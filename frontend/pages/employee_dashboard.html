<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - Secure Data Classification</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <nav class="sidebar hidden">
        <h2><i class="fa-solid fa-briefcase" style="color: #38bdf8;"></i>Employee Portal</h2>
        <ul class="sidebar-nav">
            <li><button class="active" onclick="loadDashboard()"><i class="fa-solid fa-chart-pie"></i> Dashboard</button></li>
            <li><button onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button></li>
        </ul>
    </nav>
    
    <button class="hamburger" onclick="toggleSidebar()" style="position: fixed; top: 20px; left: 20px; z-index: 1001;">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <main class="main">
        <div class="container">
            <header class="role-header">
                <h1><i class="fa-solid fa-gauge-high"></i> Employee Workspace <span id="roleDisplay" class="role-badge role-employee"></span></h1>
                <button onclick="logout()" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </header>
            
            <!-- Profile Card -->
            <div class="glass-card">
                <h2>👤 My Profile</h2>
                <div id="profileCard" class="profile-section"></div>
                <button onclick="openProfileModal()" class="btn">Edit Profile</button>
            </div>
            
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card glass-card">
                    <h3>My Uploads</h3>
                    <div id="myUploads" class="stat-number">0</div>
                </div>
                <div class="stat-card glass-card">
                    <h3>Activity Score</h3>
                    <div id="activityScore" class="stat-number">92%</div>
                </div>
            </div>
            
            <!-- Personal Charts -->
            <div class="charts-grid">
                <div class="chart-card glass-card">
                    <h3>My Activity</h3>
                    <canvas id="personalActivityChart"></canvas>
                </div>
                <div class="chart-card glass-card">
                    <h3>Recent Uploads</h3>
                    <canvas id="recentUploadsChart"></canvas>
                </div>
            </div>
            
            <!-- Secure Upload Section -->
            <div class="glass-card" style="margin-bottom: 30px;">
                <h2><i class="fa-solid fa-cloud-arrow-up" style="color: #38bdf8; margin-right: 10px;"></i>Secure Document Upload</h2>
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                    <p>Drag & Drop or Click to Upload Document for Auto-Classification</p>
                    <input type="file" id="fileInput" accept="*/*" style="display: none;" onchange="uploadFileHelper()">
                </div>
            </div>

            <!-- Secure Files List -->
            <div class="glass-card">
                <h2><i class="fa-solid fa-folder-open" style="color: #38bdf8; margin-right: 10px;"></i>Secure Classified Documents</h2>
                <div id="fileList">
                    <p style="opacity: 0.7; text-align: center; padding: 20px 0;"><i class="fa-solid fa-circle-exclamation"></i> No accessible documents found.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Profile Edit Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content glass-card">
            <h2>Edit Profile</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label for="profileName">Full Name</label>
                    <input type="text" id="profileName">
                </div>
                <button type="submit" class="btn">Save Changes</button>
                <button onclick="closeModal()" class="btn btn-danger">Cancel</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/charts.js"></script>
    <script src="../js/employee.js"></script>
</body>
</html>
